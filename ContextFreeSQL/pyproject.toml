[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ContextFreeSQL"
dynamic = ["version"]  # from src/version.py, the single place the version is set
description = "Brief description of your project"
authors = [{name = "Jonathan Scion", email = "Jonathan.scion@gmail.com"}]
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "sqlparse>=0.4.4",  # Added this line for SQL parsing
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0"
]

[project.scripts]
ContextFreeSQL = "ContextFreeSQL.main:main"

[tool.setuptools.dynamic]
version = {attr = "src.version.__version__"}