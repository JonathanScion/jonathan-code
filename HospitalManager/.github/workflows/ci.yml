name: CI

on:
  push:
    branches: [main]
    paths:
      - 'HospitalManager/**'
  pull_request:
    branches: [main]
    paths:
      - 'HospitalManager/**'

defaults:
  run:
    working-directory: HospitalManager

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            HospitalManager/backend/package-lock.json
            HospitalManager/frontend/package-lock.json

      - run: cd backend && npm ci
      - run: cd frontend && npm ci

      - run: cd backend && npx prisma generate
      - run: cd backend && npx tsc --noEmit
      - run: cd frontend && npx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            HospitalManager/backend/package-lock.json
            HospitalManager/frontend/package-lock.json

      - run: cd backend && npm ci
      - run: cd frontend && npm ci
      - run: cd backend && npx prisma generate

      - name: Backend unit tests
        run: cd backend && npm run test:unit

      - name: Frontend tests
        run: cd frontend && npm test

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: [typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hospital_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5434:5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: HospitalManager/backend/package-lock.json

      - run: cd backend && npm ci
      - run: cd backend && npx prisma generate

      - name: Run migrations
        run: cd backend && npx prisma db push --force-reset
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/hospital_test

      - name: Contract tests
        run: cd backend && npm run test:contract
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/hospital_test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hospital_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5434:5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: HospitalManager/backend/package-lock.json

      - run: cd backend && npm ci
      - run: cd backend && npx prisma generate

      - name: Run migrations
        run: cd backend && npx prisma db push --force-reset
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/hospital_test

      - name: Integration tests
        run: cd backend && npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/hospital_test
