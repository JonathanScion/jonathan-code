name: Nightly E2E

on:
  schedule:
    - cron: '0 9 * * *' # 3am CST / 9am UTC
  workflow_dispatch:

defaults:
  run:
    working-directory: HospitalManager

jobs:
  e2e:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hospital_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5434:5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            HospitalManager/backend/package-lock.json
            HospitalManager/frontend/package-lock.json
            HospitalManager/e2e/package-lock.json

      - run: cd backend && npm ci
      - run: cd frontend && npm ci
      - run: cd e2e && npm ci

      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps ${{ matrix.browser }}

      - name: Setup database
        run: cd backend && npx prisma generate && npx prisma db push --force-reset
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/hospital_test

      - name: Seed database
        run: cd backend && npx prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/hospital_test

      - name: Run E2E tests
        run: cd e2e && npx playwright test --project=${{ matrix.browser }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/hospital_test
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: HospitalManager/e2e/playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: HospitalManager/e2e/test-results/
          retention-days: 7
