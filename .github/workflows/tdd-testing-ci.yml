name: TDD_Testing CI

on:
  push:
    branches: [main]
    paths:
      - 'TDD_Testing/**'
      - '.github/workflows/tdd-testing-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'TDD_Testing/**'
      - '.github/workflows/tdd-testing-ci.yml'

defaults:
  run:
    working-directory: TDD_Testing

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: TDD_Testing/package-lock.json

      - run: npm ci
      - run: npm run -w tdd-testing-server typecheck
      - run: npm run -w tdd-testing-client typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: TDD_Testing/package-lock.json

      - run: npm ci
      - run: npm run test:unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: TDD_Testing/package-lock.json

      - run: npm ci
      - run: npm run test:integration

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: TDD_Testing/package-lock.json

      - run: npm ci
      - run: npm run test:contract

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: TDD_Testing/package-lock.json

      - run: npm ci
      - run: npm run test:smoke
