name: Build Release

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v2.1.3, etc.

defaults:
  run:
    working-directory: ContextFreeSQL

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: contextfreesql.exe
            asset_name: contextfreesql.exe
          - os: macos-latest
            artifact_name: contextfreesql
            asset_name: contextfreesql-macos
          - os: ubuntu-latest
            artifact_name: contextfreesql
            asset_name: contextfreesql-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller contextfreesql.spec --clean

      # A binary that cannot start should fail the build, not get published. Nothing here used to run the
      # thing it shipped - not even --version - and the test suite only ever runs from source, so anything
      # that behaves differently inside a PyInstaller bundle was invisible. That is how a release went out
      # whose default config path pointed at <bundle>/src/config.json, which does not exist there: running
      # it with no arguments failed with a temp path nobody could act on.
      - name: Smoke-test the built binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          set -eu
          BIN=dist/${{ matrix.artifact_name }}
          chmod +x "$BIN"
          "$BIN" --version
          "$BIN" --help > /dev/null
          "$BIN" --show-config | grep -q 'scripting_options'
          # No arguments: it must find its own bundled config, not a path inside the extracted bundle.
          # It cannot connect to anything here, so a connection error is the expected outcome
          out=$("$BIN" 2>&1 || true)
          printf '%s\n' "$out" | head -5
          if printf '%s' "$out" | grep -q 'no config file at'; then
            echo "FAIL: the binary cannot find its own default config"; exit 1
          fi
          if printf '%s' "$out" | grep -qE '_MEI|Traceback'; then
            echo "FAIL: the binary leaked a bundle path or a traceback"; exit 1
          fi

      - name: Smoke-test the built binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $bin = "dist\${{ matrix.artifact_name }}"
          & $bin --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          & $bin --help > $null
          if ($LASTEXITCODE -ne 0) { throw "--help failed" }
          if (-not (& $bin --show-config | Select-String -Quiet 'scripting_options')) {
              throw "--show-config did not carry the configuration reference"
          }
          $out = (& $bin 2>&1 | Out-String)
          $out -split "`n" | Select-Object -First 5
          if ($out -match 'no config file at') { throw "the binary cannot find its own default config" }
          if ($out -match '_MEI|Traceback') { throw "the binary leaked a bundle path or a traceback" }

      - name: Rename artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: mv dist/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}

      - name: Rename artifact (Windows)
        if: matrix.os == 'windows-latest' && matrix.artifact_name != matrix.asset_name
        run: move dist\${{ matrix.artifact_name }} dist\${{ matrix.asset_name }}
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ContextFreeSQL/dist/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # install.sh checks the binary against this, and it lets users verify a manual download
      - name: Checksums
        working-directory: .
        run: |
          cp artifacts/contextfreesql.exe/contextfreesql.exe \
             artifacts/contextfreesql-macos/contextfreesql-macos \
             artifacts/contextfreesql-linux/contextfreesql-linux .
          chmod +x contextfreesql-linux contextfreesql-macos
          sha256sum contextfreesql.exe contextfreesql-macos contextfreesql-linux | tee SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            contextfreesql.exe
            contextfreesql-macos
            contextfreesql-linux
            SHA256SUMS
            ContextFreeSQL/install.sh
            ContextFreeSQL/config.sample.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
